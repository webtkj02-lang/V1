    <!-- POPUP FOTO (dari daftar murid) -->
    <div class="popup" id="popup">
      <span class="close">&times;</span>
      <div class="slider" id="slider"></div>
      <p id="nama"></p>
    </div>

    <!-- ========== HALAMAN 3 : ALBUM ========== -->
    <section class="halaman">
      <h4>ALBUM</h4>
      <div class="album-menu">
        <div class="album-card" onclick="bukaFoto()">
          <img src="background.jpg" alt="Album Foto" />
          <p>ALBUM FOTO</p>
        </div>
        <div class="album-card" onclick="bukaVideo()">
          <img src="background.jpg" alt="Album Video" />
          <p>Album Video</p>
        </div>
      </div>
    </section>

    <!-- POPUP FOTO (album) -->
    <div id="popupFoto" class="popup">
      <button onclick="prevFoto()">◀</button>
      <img id="sliderFoto" src="background.jpg" />
      <button onclick="nextFoto()">▶</button>
      <span class="close" onclick="tutupFoto()">✖</span>
    </div>

    <!-- POPUP VIDEO -->
    <div id="popupVideo" class="popup">
      <div class="video-container">
        <button class="video-nav kiri" onclick="prevVideo()">◀</button>
        <video id="videoPlayer" controls></video>
        <button class="video-nav kanan" onclick="nextVideo()">▶</button>
        <button class="playlist-btn" onclick="togglePlaylist()">☰</button>
        <div id="playlist" class="playlist">
          <div class="item-video" onclick="pilihVideo(0)">
            <img src="background.jpg" alt=""/><div><h4>Video 1</h4><p>1.mp4</p></div>
          </div>
          <div class="item-video" onclick="pilihVideo(1)">
            <img src="background.jpg" alt=""/><div><h4>Video 2</h4><p>2.mp4</p></div>
          </div>
          <!-- tambahkan lebih banyak jika ada -->
        </div>
        <span class="close" onclick="tutupVideo()">✖</span>
      </div>
    </div>
